[project]
name = "datasette-agent-edit"
version = "0.0.1"
description = "Storage-agnostic file-editing tools (view / str_replace / insert) for Datasette Agent plugins"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers = [
    "Framework :: Datasette",
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a31",
    "python-ulid",
    "typing_extensions",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-agent-edit"
Issues = "https://github.com/datasette/datasette-agent-edit/issues"

[tool.setuptools.packages.find]
include = ["datasette_agent_edit*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
