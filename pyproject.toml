[project]
name = "datasette-agent-artifacts"
version = "0.1"
description = "Add artifacts (inline HTML+JS apps) to Datasette Agent"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a26"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-agent-artifacts"
Changelog = "https://github.com/datasette/datasette-agent-artifacts/releases"
Issues = "https://github.com/datasette/datasette-agent-artifacts/issues"
CI = "https://github.com/datasette/datasette-agent-artifacts/actions"

[project.entry-points.datasette]
agent_artifacts = "datasette_agent_artifacts"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
